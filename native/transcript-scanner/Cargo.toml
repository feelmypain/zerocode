[package]
name = "zerocode-transcript-scanner"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
memchr = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zstd = "0.13.3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
