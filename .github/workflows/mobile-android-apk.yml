name: Mobile Android APK

# On-demand Android APK build. Builds ZeroCode-Android-<version>.apk via
# release-android.yml and optionally attaches it to an existing GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.18). Defaults to apps/desktop/package.json."
        required: false
        type: string
      release_tag:
        description: "Optional existing GitHub Release tag to attach the APK to (for example v0.1.18)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-android-apk-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Android APK version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - id: meta
        name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-${INPUT_TAG:-$(jq -r '.version' apps/desktop/package.json)}}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $raw" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Android APK
    needs: [prepare]
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable

  attach_release:
    name: Attach APK to GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-android-apk
          path: release-android

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="release-android/ZeroCode-Android-${VERSION}.apk"
          gh release upload "$RELEASE_TAG" "$apk" --clobber
          echo "Uploaded $(basename "$apk") to release $RELEASE_TAG."
